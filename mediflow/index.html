   <g class="ring2"><circle cx="75" cy="75" r="58" fill="none" stroke="#5ff5e8" stroke-width="2" stroke-dasharray="4 10" opacity=".7"/></g></svg>
  <span class="pulse"></span><span class="pulse p2"></span><div class="cross"></div>
 </div>
